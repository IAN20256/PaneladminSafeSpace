<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Safe Space — Feedback (privado)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg:#0d0d1a;--surface:#13132b;--surface2:#1a1a38;
    --accent:#7c6ff7;--accent2:#a78bfa;--text:#e8e6ff;--muted:#8b88b3;
    --border:rgba(124,111,247,0.2);--danger:#f87171;
    --c-sugerencia:#48cae4;--c-queja:#f87171;--c-bug:#fbbf24;--c-otro:#a78bfa;--c-reporte:#fb7185;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;padding:1.5rem;min-height:100vh;}
  h1{font-family:'Syne',sans-serif;font-size:1.4rem;margin-bottom:1rem;color:var(--accent2);}
  .key-box{display:flex;gap:.5rem;margin-bottom:1.2rem;max-width:500px;}
  input,textarea{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.7rem .9rem;color:var(--text);font-size:.9rem;outline:none;font-family:inherit;}
  input{flex:1;}
  button{background:linear-gradient(135deg,var(--accent),#6366f1);border:none;border-radius:10px;padding:.7rem 1.2rem;color:white;font-weight:500;cursor:pointer;font-family:inherit;font-size:.85rem;}
  button:disabled{opacity:.5;cursor:not-allowed;}

  .toolbar{max-width:600px;margin-bottom:1rem;display:none;flex-direction:column;gap:.7rem;}
  .toolbar.show{display:flex;}
  .search-box input{width:100%;}
  .filters{display:flex;gap:.4rem;flex-wrap:wrap;}
  .filter-btn{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:.4rem .9rem;font-size:.78rem;color:var(--muted);cursor:pointer;transition:.15s;}
  .filter-btn.active{background:var(--surface2);color:var(--text);border-color:var(--accent2);}
  .stats{font-size:.78rem;color:var(--muted);}

  .entry{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:.8rem;max-width:600px;position:relative;transition:.2s;}
  .entry.resuelto{opacity:.5;}
  .entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;margin-bottom:.5rem;}
  .entry-tipo{display:inline-block;font-size:.7rem;padding:.2rem .6rem;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;font-weight:600;color:#0d0d1a;}
  .entry-msg{font-size:.9rem;line-height:1.5;margin-bottom:.5rem;white-space:pre-wrap;}
  .entry-bottom{display:flex;justify-content:space-between;align-items:center;}
  .entry-fecha{font-size:.75rem;color:var(--muted);}
  .resolve-btn{background:var(--surface2);color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:.35rem .7rem;font-size:.75rem;cursor:pointer;}
  .resolve-btn.done{color:#4ade80;border-color:#4ade80;}
  .delete-btn{background:rgba(248,113,113,0.1);color:var(--danger);border:1px solid rgba(248,113,113,0.35);border-radius:8px;padding:.35rem .7rem;font-size:.75rem;cursor:pointer;}
  .delete-btn:hover{background:rgba(248,113,113,0.18);}

  .error{color:var(--danger);font-size:.85rem;margin-bottom:1rem;}
  .empty{color:var(--muted);}

  .spinner{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--accent2);border-radius:50%;animation:spin .7s linear infinite;margin:2rem auto;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .metrics-box{max-width:600px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:1rem;display:none;}
  .metrics-box.show{display:block;}
  .metrics-title{font-size:.78rem;color:var(--muted);margin-bottom:.6rem;text-transform:uppercase;letter-spacing:.03em;}
  .metrics-row{display:flex;gap:1.5rem;flex-wrap:wrap;}
  .metric-item{display:flex;flex-direction:column;}
  .metric-num{font-size:1.4rem;font-weight:700;color:var(--accent2);}
  .metric-label{font-size:.72rem;color:var(--muted);}

  .codes-box{max-width:600px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:1rem;display:none;}
  .codes-box.show{display:block;}
  .codes-form{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.6rem;}
  .codes-form label{display:flex;flex-direction:column;gap:.25rem;font-size:.72rem;color:var(--muted);}
  .codes-form input{width:100%;padding:.55rem .7rem;font-size:.85rem;}
  .codes-form .full{grid-column:1 / -1;}
  .codes-msg{font-size:.8rem;margin:.3rem 0 .6rem;min-height:1em;}
  .codes-msg.ok{color:#4ade80;} .codes-msg.err{color:var(--danger);}
  .code-row{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .8rem;padding:.6rem 0;border-top:1px solid var(--border);font-size:.8rem;}
  .code-row.off{opacity:.45;}
  .code-name{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:.9rem;color:var(--text);letter-spacing:.03em;}
  .code-meta{color:var(--muted);}
  .code-actions{margin-left:auto;display:flex;gap:.4rem;}
  .small-btn{background:var(--surface2);color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:.3rem .6rem;font-size:.72rem;cursor:pointer;}
</style>
</head>
<body>
  <h1>📬 Feedback de Safe Space</h1>

  <div class="key-box">
    <input type="password" id="adminKey" placeholder="Pega tu clave de administrador aquí">
    <button onclick="cargarFeedback()">Ver feedback</button>
  </div>

  <div class="key-box" style="margin-top:-.6rem;">
    <input type="password" id="bottleKey" placeholder="Clave del Worker de botella (para poder borrar)">
  </div>

  <div class="error" id="error"></div>

  <div class="toolbar" id="toolbar">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar en los mensajes..." oninput="renderLista()">
    </div>
    <div class="filters" id="filters">
      <button class="filter-btn active" data-tipo="todos" onclick="setFiltro('todos',this)">Todos</button>
      <button class="filter-btn" data-tipo="sugerencia" onclick="setFiltro('sugerencia',this)">💡 Sugerencia</button>
      <button class="filter-btn" data-tipo="queja" onclick="setFiltro('queja',this)">⚠️ Queja</button>
      <button class="filter-btn" data-tipo="bug" onclick="setFiltro('bug',this)">🐛 Bug</button>
      <button class="filter-btn" data-tipo="otro" onclick="setFiltro('otro',this)">✨ Otro</button>
      <button class="filter-btn" data-tipo="reporte" onclick="setFiltro('reporte',this)">🚩 Reportes</button>
      <button class="filter-btn" data-tipo="pendientes" onclick="setFiltro('pendientes',this)">🔵 Sin resolver</button>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="metrics-box" id="metricsBox">
    <div class="metrics-title">Métricas del filtro de la botella</div>
    <div class="metrics-row">
      <div class="metric-item">
        <span class="metric-num" id="metricToxicidad">0</span>
        <span class="metric-label">Bloqueados por toxicidad</span>
      </div>
      <div class="metric-item">
        <span class="metric-num" id="metricCrisis">0</span>
        <span class="metric-label">Desviados por crisis</span>
      </div>
    </div>
  </div>

  <div class="codes-box" id="codesBox">
    <div class="metrics-title">🎁 Códigos de regalo de SafeSpace+</div>
    <div class="codes-form">
      <label>Código (vacío = se crea uno al azar)<input type="text" id="codeName" placeholder="Ej. ESCUELA-2026" maxlength="32" style="text-transform:uppercase;"></label>
      <label>Días de SafeSpace+ que da<input type="number" id="codeDays" value="30" min="1" max="366"></label>
      <label>Cuántas veces se puede usar<input type="number" id="codeUses" value="1" min="1" max="10000"></label>
      <label>Vence (opcional)<input type="date" id="codeExpires"></label>
      <label class="full">Nota para ti (opcional)<input type="text" id="codeNote" placeholder="Ej. Para mis testers" maxlength="120"></label>
    </div>
    <button onclick="crearCodigo()" id="codeCreateBtn">Crear código</button>
    <div class="codes-msg" id="codesMsg"></div>
    <div id="codesList"></div>
  </div>

  <div id="spinner" class="spinner" style="display:none;"></div>
  <div id="lista"></div>

<script>
// Cambia esto por la URL real de tu Worker una vez desplegado
const WORKER_URL = 'https://safespace-feedback.azulito20124.workers.dev';
// El mismo que ya usa la app para la botella — aquí solo se usa para borrar
const BOTTLE_WORKER_URL = 'https://safespace-bottles.azulito20124.workers.dev';

const CAT_COLORS = {
  sugerencia: 'var(--c-sugerencia)',
  queja: 'var(--c-queja)',
  bug: 'var(--c-bug)',
  otro: 'var(--c-otro)',
  reporte: 'var(--c-reporte)',
};
const CAT_LABELS = {
  sugerencia: '💡 Sugerencia',
  queja: '⚠️ Queja',
  bug: '🐛 Bug',
  otro: '✨ Otro',
  reporte: '🚩 Reporte',
};

let todasLasEntradas = [];
let filtroActual = 'todos';

// ---------- Marcado de "resuelto" guardado localmente (por navegador) ----------
function getResueltos() {
  try {
    return JSON.parse(localStorage.getItem('sf_feedback_resueltos') || '[]');
  } catch (e) {
    return [];
  }
}
function toggleResuelto(id) {
  const resueltos = getResueltos();
  const idx = resueltos.indexOf(id);
  if (idx === -1) resueltos.push(id);
  else resueltos.splice(idx, 1);
  localStorage.setItem('sf_feedback_resueltos', JSON.stringify(resueltos));
  renderLista();
}

function setFiltro(tipo, btn) {
  filtroActual = tipo;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderLista();
}

async function cargarFeedback() {
  const key = document.getElementById('adminKey').value.trim();
  const errorEl = document.getElementById('error');
  const listaEl = document.getElementById('lista');
  const spinnerEl = document.getElementById('spinner');
  const toolbarEl = document.getElementById('toolbar');
  errorEl.textContent = '';
  listaEl.innerHTML = '';
  toolbarEl.classList.remove('show');

  if (!key) {
    errorEl.textContent = 'Escribe tu clave primero.';
    return;
  }

  spinnerEl.style.display = 'block';

  try {
    const res = await fetch(WORKER_URL + '/list', {
      headers: { 'Authorization': 'Bearer ' + key }
    });

    spinnerEl.style.display = 'none';

    if (res.status === 401) {
      errorEl.textContent = 'Clave incorrecta.';
      return;
    }
    if (!res.ok) {
      errorEl.textContent = 'Error al conectar con el servidor.';
      return;
    }

    const data = await res.json();
    const allEntries = data.entries || [];

    // Las entradas de tipo "metrica" no son mensajes para leer, son solo
    // contadores anonimos del filtro de la botella. Se separan del resto.
    const metricEntries = allEntries.filter(e => e.tipo === 'metrica');
    todasLasEntradas = allEntries.filter(e => e.tipo !== 'metrica');

    const numToxicidad = metricEntries.filter(e => e.mensaje === 'toxicidad_bloqueada').length;
    const numCrisis = metricEntries.filter(e => e.mensaje === 'crisis_desviada').length;
    document.getElementById('metricToxicidad').textContent = numToxicidad;
    document.getElementById('metricCrisis').textContent = numCrisis;
    document.getElementById('metricsBox').classList.add('show');

    toolbarEl.classList.add('show');
    renderLista();
    cargarCodigos();

  } catch (err) {
    spinnerEl.style.display = 'none';
    errorEl.textContent = 'Error al conectar con el servidor.';
  }
}

function renderLista() {
  const listaEl = document.getElementById('lista');
  const statsEl = document.getElementById('stats');
  const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();
  const resueltos = getResueltos();

  let filtradas = todasLasEntradas;

  if (filtroActual === 'pendientes') {
    filtradas = filtradas.filter(e => !resueltos.includes(e.id));
  } else if (filtroActual !== 'todos') {
    filtradas = filtradas.filter(e => e.tipo === filtroActual);
  }

  if (search) {
    filtradas = filtradas.filter(e => e.mensaje.toLowerCase().includes(search));
  }

  const totalPendientes = todasLasEntradas.filter(e => !resueltos.includes(e.id)).length;
  statsEl.textContent = todasLasEntradas.length + ' mensajes en total · ' + totalPendientes + ' sin resolver';

  if (filtradas.length === 0) {
    listaEl.innerHTML = '<p class="empty">No hay mensajes que coincidan.</p>';
    return;
  }

  listaEl.innerHTML = filtradas.map(e => {
    const esResuelto = resueltos.includes(e.id);
    const color = CAT_COLORS[e.tipo] || CAT_COLORS.otro;
    const label = CAT_LABELS[e.tipo] || ('✨ ' + escapeHtml(e.tipo));
    const bottleId = extraerBottleId(e.mensaje);
    const yaBorrado = bottleId && getBorrados().includes(bottleId);
    const botonBorrar = bottleId
      ? (yaBorrado
          ? `<span style="font-size:.72rem;color:#4ade80;">✓ Mensaje borrado</span>`
          : `<button class="delete-btn" onclick="borrarMensajeBotella('${bottleId}', this)">🗑️ Borrar mensaje de botella</button>`)
      : '';
    return `
      <div class="entry ${esResuelto ? 'resuelto' : ''}">
        <div class="entry-top">
          <span class="entry-tipo" style="background:${color};">${label}</span>
        </div>
        <div class="entry-msg">${escapeHtml(e.mensaje)}</div>
        <div class="entry-bottom">
          <span class="entry-fecha">${new Date(e.fecha).toLocaleString('es-MX')}</span>
          <div style="display:flex;gap:.5rem;align-items:center;">
            ${botonBorrar}
            <button class="resolve-btn ${esResuelto ? 'done' : ''}" onclick="toggleResuelto('${e.id}')">
              ${esResuelto ? '✓ Resuelto' : 'Marcar como resuelto'}
            </button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// Extrae el id de botella del texto del reporte, ej:
// "[Reporte de botella] Categoria: tristeza | Mensaje: ... | ID: bottle:123:abc"
function extraerBottleId(mensaje) {
  const m = mensaje.match(/\|\s*ID:\s*(bottle:\S+)/);
  return m ? m[1] : null;
}

// ---------- Mensajes de botella ya borrados (guardado localmente) ----------
function getBorrados() {
  try {
    return JSON.parse(localStorage.getItem('sf_bottles_borrados') || '[]');
  } catch (e) {
    return [];
  }
}
function marcarBorrado(id) {
  const borrados = getBorrados();
  if (!borrados.includes(id)) borrados.push(id);
  localStorage.setItem('sf_bottles_borrados', JSON.stringify(borrados));
}

async function borrarMensajeBotella(id, btn) {
  const secret = document.getElementById('bottleKey').value.trim();
  if (!secret) {
    alert('Pega primero tu clave del Worker de botella (arriba).');
    return;
  }
  if (!confirm('¿Borrar este mensaje de la botella? No se puede deshacer.')) return;

  btn.disabled = true;
  btn.textContent = 'Borrando...';

  try {
    const res = await fetch(BOTTLE_WORKER_URL + '/bottle/delete?id=' + encodeURIComponent(id) + '&secret=' + encodeURIComponent(secret));
    const data = await res.json();

    if (res.status === 401) {
      alert('Clave del Worker de botella incorrecta.');
      btn.disabled = false;
      btn.textContent = '🗑️ Borrar mensaje de botella';
      return;
    }
    if (!data.ok) {
      alert('No se pudo borrar: ' + (data.error || 'error desconocido'));
      btn.disabled = false;
      btn.textContent = '🗑️ Borrar mensaje de botella';
      return;
    }

    marcarBorrado(id);
    renderLista();
  } catch (err) {
    alert('Error de conexión al intentar borrar.');
    btn.disabled = false;
    btn.textContent = '🗑️ Borrar mensaje de botella';
  }
}

// ---------- Códigos de regalo ----------
function adminHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + document.getElementById('adminKey').value.trim() };
}
function codesMsg(text, kind) {
  const el = document.getElementById('codesMsg');
  el.textContent = text || '';
  el.className = 'codes-msg' + (kind ? ' ' + kind : '');
}
async function cargarCodigos() {
  const box = document.getElementById('codesBox');
  box.classList.add('show');
  try {
    const res = await fetch(WORKER_URL + '/codes', { headers: adminHeaders() });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { codesMsg(data.error || 'No se pudieron cargar los códigos.', 'err'); return; }
    renderCodigos(data.codes || []);
  } catch (e) {
    codesMsg('Error al conectar con el servidor.', 'err');
  }
}
function renderCodigos(codes) {
  const list = document.getElementById('codesList');
  if (!codes.length) { list.innerHTML = '<p class="empty" style="font-size:.8rem;">Todavía no hay códigos.</p>'; return; }
  const hoy = new Date().toISOString().slice(0, 10);
  list.innerHTML = codes.map(c => {
    const vencido = c.expires && c.expires < hoy;
    const agotado = c.uses >= c.max_uses;
    const estado = !c.active ? 'Desactivado' : vencido ? 'Vencido' : agotado ? 'Agotado' : 'Activo';
    const off = estado !== 'Activo';
    const code = escapeHtml(c.code);
    return `
      <div class="code-row ${off ? 'off' : ''}">
        <span class="code-name">${code}</span>
        <span class="code-meta">${c.days} días · ${c.uses}/${c.max_uses} usos${c.expires ? ' · vence ' + escapeHtml(c.expires) : ''} · ${estado}</span>
        ${c.note ? `<span class="code-meta" style="width:100%;">${escapeHtml(c.note)}</span>` : ''}
        <span class="code-actions">
          <button class="small-btn" onclick="copiarCodigo('${code}', this)">Copiar</button>
          ${c.active ? `<button class="small-btn" onclick="desactivarCodigo('${code}')">Desactivar</button>` : ''}
        </span>
      </div>`;
  }).join('');
}
async function crearCodigo() {
  const btn = document.getElementById('codeCreateBtn');
  const body = {
    code: document.getElementById('codeName').value.trim() || undefined,
    days: Number(document.getElementById('codeDays').value),
    maxUses: Number(document.getElementById('codeUses').value),
    expires: document.getElementById('codeExpires').value || undefined,
    note: document.getElementById('codeNote').value.trim() || undefined,
  };
  btn.disabled = true; codesMsg('Creando…');
  try {
    const res = await fetch(WORKER_URL + '/codes', { method: 'POST', headers: adminHeaders(), body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { codesMsg(data.error || 'No se pudo crear el código.', 'err'); return; }
    codesMsg('Código creado: ' + data.code + ' (' + data.days + (data.days === 1 ? ' día, ' : ' días, ') + data.maxUses + (data.maxUses === 1 ? ' uso)' : ' usos)'), 'ok');
    document.getElementById('codeName').value = '';
    document.getElementById('codeNote').value = '';
    cargarCodigos();
  } catch (e) {
    codesMsg('Error al conectar con el servidor.', 'err');
  } finally {
    btn.disabled = false;
  }
}
async function desactivarCodigo(code) {
  if (!confirm('¿Desactivar el código ' + code + '? Ya no se podrá canjear (quien ya lo usó conserva sus días).')) return;
  try {
    const res = await fetch(WORKER_URL + '/codes/disable', { method: 'POST', headers: adminHeaders(), body: JSON.stringify({ code }) });
    if (!res.ok) { codesMsg('No se pudo desactivar.', 'err'); return; }
    codesMsg('Código ' + code + ' desactivado.', 'ok');
    cargarCodigos();
  } catch (e) {
    codesMsg('Error al conectar con el servidor.', 'err');
  }
}
function copiarCodigo(code, btn) {
  const done = () => { btn.textContent = '¡Copiado!'; setTimeout(() => { btn.textContent = 'Copiar'; }, 1400); };
  if (navigator.clipboard) navigator.clipboard.writeText(code).then(done).catch(() => prompt('Copia el código:', code));
  else prompt('Copia el código:', code);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Guarda la clave localmente para no tener que pegarla cada vez
window.addEventListener('load', () => {
  const saved = localStorage.getItem('sf_admin_key');
  if (saved) document.getElementById('adminKey').value = saved;
  const savedBottle = localStorage.getItem('sf_bottle_key');
  if (savedBottle) document.getElementById('bottleKey').value = savedBottle;
});
document.getElementById('adminKey').addEventListener('change', (e) => {
  localStorage.setItem('sf_admin_key', e.target.value.trim());
});
document.getElementById('bottleKey').addEventListener('change', (e) => {
  localStorage.setItem('sf_bottle_key', e.target.value.trim());
});
</script>
</body>
</html>
